[project]
name = "app-grandes-eventos"
version = "0.1.0"
description = "Aplicacao de apoio a grandes eventos"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]